<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Kit, step 02 "Sketch": wearing an artist beret, pencil in paw, studying the drawing board. -->

  <!-- easel -->
  <g stroke="#111" stroke-width="5" stroke-linecap="round">
    <path d="M58 140 L60 234" />
    <path d="M30 140 L14 232 M86 140 L102 232" />
  </g>
  <!-- the board, with a wireframe sketch on it -->
  <g transform="rotate(-4 58 90)">
    <rect x="10" y="26" width="96" height="114" rx="5" fill="#fff" stroke="#111" stroke-width="5"/>
    <g fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <rect x="20" y="36" width="76" height="12" rx="3" fill="#ffe066"/>
      <circle cx="31" cy="64" r="8" fill="#c4b5fd"/>
      <path d="M45 60 H86 M45 69 H74"/>
      <rect x="20" y="82" width="76" height="34" rx="3"/>
      <path d="M20 82 L96 116 M96 82 L20 116" stroke-width="2"/>
      <path class="draw" d="M22 128 Q30 122 38 128 T54 128 T70 128" stroke="#ff7a1a" stroke-width="3.5"/>
    </g>
    <!-- ledge -->
    <rect x="4" y="138" width="108" height="9" rx="3" fill="#ffd23f" stroke="#111" stroke-width="4"/>
  </g>

  <!-- Kit's head, turned slightly toward the board -->
  <g transform="translate(90 52) scale(0.76) rotate(-6 100 100)">
    <path d="M38 40 Q30 6 62 20 L58 52Z" fill="#ff7a1a" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M162 40 Q166 20 160 12 L153 24 L147 14 Q141 15 138 20 L142 52Z" fill="#ff7a1a" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M44 30 Q42 18 54 24Z" fill="#ffd9b8"/>
    <ellipse cx="100" cy="100" rx="82" ry="76" fill="#ff7a1a" stroke="#111" stroke-width="6"/>
    <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
      <path d="M80 36 L68 48 L80 60 M120 36 L132 48 L120 60 M106 32 L94 64"/>
      <path d="M22 86 Q40 88 48 98 M20 112 Q38 110 46 118 M178 86 Q160 88 152 98 M180 112 Q162 110 154 118"/>
    </g>
    <path d="M110 76 Q132 62 150 80 Q160 100 142 110 Q120 116 112 100Z" fill="#111"/>
    <ellipse cx="100" cy="132" rx="46" ry="34" fill="#fff8ef" stroke="#111" stroke-width="5"/>


    <!-- artist beret, tipped to one side -->
    <g transform="rotate(-6 110 30)" stroke="#111" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M112 2 Q116 -10 124 -8" fill="none" stroke-width="7"/>
      <path d="M52 44 Q46 4 112 2 Q180 4 180 36 Q172 46 144 42 Q100 36 52 44Z" fill="#ff5c8a"/>
      <path d="M66 30 Q80 16 108 13" fill="none" stroke="#fff8ef" stroke-width="5" opacity="0.6"/>
    </g>

    <!-- focused eyes, half-lidded, looking left at the board -->
    <!-- squinting eye, drawn as a ">" -->
    <path d="M62 78 L80 87 L62 96" fill="none" stroke="#111" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M118 89 H142 Q142 105 130 105 Q118 105 118 89Z" fill="#fff8ef"/>
    <circle cx="124.5" cy="96" r="6" fill="#111"/>
    <circle cx="122.5" cy="94" r="2" fill="#fff"/>

    <path d="M88 116 Q100 110 112 116 Q106 128 100 128 Q94 128 88 116Z" fill="#f4a5b8" stroke="#111" stroke-width="4" stroke-linejoin="round"/>

    <!-- small "hmm" mouth -->
    <path d="M100 128 V136 M100 136 Q93 141 86 138 M100 136 Q107 141 114 138" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="118" r="9" fill="#ff5c8a" opacity="0.45"/>
    <circle cx="148" cy="118" r="9" fill="#ff5c8a" opacity="0.45"/>
  </g>

  <!-- pencil, held up in Kit's paw -->
  <g transform="rotate(5 206 202)" stroke="#111" stroke-linejoin="round">
    <path d="M140 196 H214 V206 H140Z" fill="#ffd23f" stroke-width="3.5"/>
    <path d="M140 201 H214" fill="none" stroke-width="1.8"/>
    <path d="M214 196 H221 V206 H214Z" fill="#cfd4dc" stroke-width="3.5"/>
    <path d="M221 196 H228 Q232 201 228 206 H221Z" fill="#ff8fa3" stroke-width="3.5"/>
    <path d="M140 196 L122 201 L140 206Z" fill="#f5d6a8" stroke-width="3.5"/>
    <path d="M128 199.3 L122 201 L128 202.7Z" fill="#111" stroke-width="1.8"/>
  </g>
  <g stroke="#111" stroke-linejoin="round" stroke-linecap="round">
    <path d="M196 240 Q194 226 198 212 L220 214 Q219 228 222 240Z" fill="#ff7a1a" stroke-width="5"/>
    <path d="M200 228 Q209 226 218 230" fill="none" stroke-width="4.5"/>
    <path d="M190 200 Q190 184 206 184 Q224 184 224 200 Q224 216 206 216 Q190 216 190 200Z" fill="#ff7a1a" stroke-width="5"/>
    <path d="M197 186 Q194 194 198 200 M206 184 Q203 193 207 200 M215 186 Q212 194 216 200" fill="none" stroke-width="3.5"/>
    <ellipse cx="208" cy="208" rx="6" ry="4" fill="#f4a5b8" stroke="none"/>
  </g>

  <style>
    .draw { stroke-dasharray: 60; animation: draw 3s ease-in-out infinite; }
    @keyframes draw { 0%, 10% { stroke-dashoffset: 60; } 55%, 85% { stroke-dashoffset: 0; } 100% { stroke-dashoffset: 60; opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .draw { animation: none; stroke-dashoffset: 0; } }
  </style>
</svg>
