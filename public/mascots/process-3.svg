<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240">
  <!-- Kit, step 03 "Build": hard hat on, hammer in paw, nailing together a house frame. -->

  <g transform="translate(8 224) scale(0.82) translate(-8 -224)">
  <!-- house skeleton: each beam is an ink stroke under a timber stroke -->
  <g fill="none" stroke-linecap="square" stroke-linejoin="miter">
    <g stroke="#111" stroke-width="13">
      <path d="M12 224 H118"/>
      <path d="M16 224 V134 M52 224 V134 M86 224 V134 M114 224 V134"/>
      <path d="M12 134 H118"/>
      <path d="M8 136 L64 76 L122 136"/>
      <path d="M64 80 V132 M64 104 L36 132 M64 104 L92 132"/>
      <path d="M16 184 L52 150" stroke-linecap="butt"/>
    </g>
    <g stroke="#f5d6a8" stroke-width="6">
      <path d="M12 224 H118"/>
      <path d="M16 224 V134 M52 224 V134 M86 224 V134 M114 224 V134"/>
      <path d="M12 134 H118"/>
      <path d="M8 136 L64 76 L122 136"/>
      <path d="M64 80 V132 M64 104 L36 132 M64 104 L92 132"/>
      <path d="M16 184 L52 150" stroke-linecap="butt"/>
    </g>
  </g>
  <!-- nail heads at the joints -->
  <g fill="#111">
    <circle cx="16" cy="134" r="2.4"/><circle cx="52" cy="134" r="2.4"/>
    <circle cx="86" cy="134" r="2.4"/><circle cx="114" cy="134" r="2.4"/>
    <circle cx="64" cy="80" r="2.4"/><circle cx="64" cy="104" r="2.4"/>
    <circle cx="16" cy="224" r="2.4"/><circle cx="52" cy="224" r="2.4"/><circle cx="86" cy="224" r="2.4"/>
  </g>
  </g>
  <!-- the nail Kit is driving, with impact sparks -->
  <path d="M96 186 H110" stroke="#111" stroke-width="3" stroke-linecap="round"/>
  <path d="M110 181 V191" stroke="#111" stroke-width="4" stroke-linecap="round"/>
  <g class="bang" fill="none" stroke="#ff7a1a" stroke-width="4" stroke-linecap="round">
    <path d="M102 172 L96 164 M112 168 L114 158 M92 182 L82 180"/>
  </g>

  <!-- Kit's head, focused down-left on the nail -->
  <g transform="translate(110 58) scale(0.68) rotate(-8 100 100)">
    <path d="M38 40 Q30 6 62 20 L58 52Z" fill="#ff7a1a" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <path d="M162 40 Q166 20 160 12 L153 24 L147 14 Q141 15 138 20 L142 52Z" fill="#ff7a1a" stroke="#111" stroke-width="6" stroke-linejoin="round"/>
    <ellipse cx="100" cy="100" rx="82" ry="76" fill="#ff7a1a" stroke="#111" stroke-width="6"/>
    <g fill="none" stroke="#111" stroke-linecap="round" stroke-linejoin="round" stroke-width="7">
      <path d="M22 86 Q40 88 48 98 M20 112 Q38 110 46 118 M178 86 Q160 88 152 98 M180 112 Q162 110 154 118"/>
    </g>
    <path d="M110 76 Q132 62 150 80 Q160 100 142 110 Q120 116 112 100Z" fill="#111"/>
    <ellipse cx="100" cy="132" rx="46" ry="34" fill="#fff8ef" stroke="#111" stroke-width="5"/>

    <!-- hard hat -->
    <g stroke="#111" stroke-width="6" stroke-linejoin="round" stroke-linecap="round">
      <path d="M40 50 Q40 -6 100 -8 Q160 -6 160 50Z" fill="#ffe066"/>
      <path d="M100 -8 V50" fill="none" stroke-width="5"/>
      <path d="M78 -4 Q70 20 72 50 M122 -4 Q130 20 128 50" fill="none" stroke-width="4"/>
      <path d="M22 52 Q100 38 178 52 Q182 62 170 62 Q100 52 30 62 Q18 62 22 52Z" fill="#ffd23f"/>
      <path d="M52 30 Q58 10 78 4" fill="none" stroke="#fff8ef" stroke-width="5" opacity="0.7"/>
    </g>

    <!-- eyes looking down-left -->
    <ellipse cx="66" cy="96" rx="9" ry="11" fill="#111"/>
    <circle cx="64" cy="98" r="3.2" fill="#fff"/>
    <ellipse cx="126" cy="96" rx="9" ry="11" fill="#111" stroke="#fff8ef" stroke-width="3"/>
    <circle cx="124" cy="98" r="3.2" fill="#fff"/>
    <!-- determined brows -->
    <path d="M54 76 L78 82 M114 82 L138 76" fill="none" stroke="#111" stroke-width="5" stroke-linecap="round"/>

    <path d="M88 116 Q100 110 112 116 Q106 128 100 128 Q94 128 88 116Z" fill="#f4a5b8" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <!-- concentrating: tongue poking out the side -->
    <path d="M78 142 Q76 154 84 154 Q90 152 88 142Z" fill="#ff8fa3" stroke="#111" stroke-width="4" stroke-linejoin="round"/>
    <path d="M100 128 V136 M100 136 Q90 144 76 140 M100 136 Q108 141 116 138" fill="none" stroke="#111" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="52" cy="118" r="9" fill="#ff5c8a" opacity="0.45"/>
    <circle cx="148" cy="118" r="9" fill="#ff5c8a" opacity="0.45"/>
  </g>

  <!-- Kit's right paw (viewer's left) gripping the hammer; the group taps around the paw -->
  <g class="swing" stroke="#111" stroke-linejoin="round" stroke-linecap="round">
    <!-- handle -->
    <path d="M 126 180 L 190 190 L 188 200 L 124 190 Z" fill="#c98a4b" stroke-width="3.5"/>
    <!-- head -->
    <path d="M 114 165 L 132 168 L 127 206 L 109 203 Z" fill="#cfd4dc" stroke-width="4"/>
    <path d="M 110 175 L 105 174 L 102 195 L 107 196" fill="#cfd4dc" stroke-width="3.5"/>
    <g transform="translate(160 190) scale(0.9) translate(-160 -190)">
    <!-- fist wrapped around the handle: knuckles toward the viewer, palm hidden -->
    <path d="M 143 190 Q 143 173 160 173 Q 178 173 178 190 Q 178 208 160 208 Q 143 208 143 190 Z" fill="#ff7a1a" stroke-width="5.6"/>
    <path d="M 152 194 Q 150 201 153 206 M 160 195 Q 158 202 160 208 M 168 194 Q 167 201 169 206" fill="none" stroke-width="3.9"/>
    <!-- thumb curled over the top of the handle -->
    <path d="M 146 186 Q 150 179 160 180 Q 170 181 172 186 Q 166 191 157 190 Q 149 190 146 186 Z" fill="#ff7a1a" stroke-width="3.9"/>
    </g>
  </g>

  <style>
    .swing { transform-box: view-box; transform-origin: 158px 190px; animation: swing 1.4s ease-in infinite; }
    @keyframes swing { 0%, 100% { transform: rotate(0deg); } 45% { transform: rotate(14deg); } 60% { transform: rotate(-2deg); } 70% { transform: rotate(0deg); } }
    .bang { opacity: 0; animation: bang 1.4s linear infinite; }
    @keyframes bang { 0%, 58% { opacity: 0; } 62%, 80% { opacity: 1; } 90%, 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .swing { animation: none; } .bang { animation: none; opacity: 1; } }
  </style>
</svg>
